<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL Shortener</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">

</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">URL Shortener</div>
        <div class="nav-buttons">
            <button class="nav-btn secondary">Login</button>
            <button class="nav-btn primary">Register</button>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container">
        <h1>Shorten Your Links </h1>
        <p class="subtitle">Fast, simple and secure URL shortening</p>

        <form method="post" action="/shorten">
            <label for="long_url">Enter Long URL</label>
            <input
                type="url"
                id="long_url"
                name="long_url"
                placeholder="https://example.com/very/long/link"
                required
            />

            <button type="submit" class="main-btn">Shorten URL</button>
        </form>

        {% if short_url %}
        <div class="result">
            <p>Your shortened URL:</p>
            <a href="{{ short_url }}" target="_blank">{{ short_url }}</a>
        </div>
        {% endif %}
    </main>

    <!-- Footer -->
    <footer>
        <p>Shorten your URLs and track analytics • Fast • Simple • Secure</p>
    </footer>

</body>
</html>
